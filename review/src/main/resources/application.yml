spring:
    profiles:
        active: local
        group:
            local: local, common
            blue: blue, common
            green: green, common


server:
    env: blue

---

spring:
    config:
        activate:
            on-profile: local

server:
    port: 8080
    address: localhost

---

spring:
    config:
        activate:
            on-profile: blue

server:
    port: 8080
    address: 15.164.123.197

---

spring:
    config:
        activate:
            on-profile: green

server:
    port: 8081
    address: 15.164.123.197

---

spring:
    config:
        activate:
            on-profile: common
    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:rss
        username: sa
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        hibernate:
            ddl-auto: create
        show-sql: true
